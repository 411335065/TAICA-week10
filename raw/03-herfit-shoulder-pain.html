  <script>
    document.querySelectorAll('.nav-dropdown-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        if (window.innerWidth < 768) btn.closest('.nav-dropdown').classList.toggle('open');
      });
    });

    // 返回: step back in history when the reader came from the journal list, so the
    // list keeps its tab, filter and scroll position; a direct visit follows the link.
    document.addEventListener('click', (e) => {
      const back = e.target.closest('.kb-back');
      if (!back || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      let from;
      try { from = new URL(document.referrer); } catch (err) { return; }
      if (from.origin === location.origin && /^\/journal\/(cc\/)?(index\.html)?$/.test(from.pathname)) {
        e.preventDefault();
        history.back();
      }
    });

    // Share: copy the article link to the clipboard, with brief feedback.
    document.querySelectorAll('.kb-share-copy').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.getAttribute('data-url');
        if (!navigator.clipboard || !url) return;
        navigator.clipboard.writeText(url).then(() => {
          const original = btn.textContent;
          btn.textContent = '已複製 ✓';
          setTimeout(() => { btn.textContent = original; }, 1500);
        }).catch(() => {});
      });
    });
  </script>
